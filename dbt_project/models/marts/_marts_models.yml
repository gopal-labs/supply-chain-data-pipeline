version: 2

models:
  - name: dim_shipping_mode
    description: One row per distinct shipping mode
    columns:
      - name: shipping_mode_id
        tests:
          - unique
          - not_null
      - name: shipping_mode
        tests:
          - unique
          - not_null

  - name: fact_deliveries
    description: One row per order item, with delivery risk and financial metrics
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: shipping_mode_id
        tests:
          - not_null
      - name: late_delivery_risk
        tests:
          - not_null
      - name: delivery_status
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Advance shipping'
                - 'Late delivery'
                - 'Shipping on time'
                - 'Shipping canceled'
