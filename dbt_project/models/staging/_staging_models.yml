version: 2

models:
  - name: stg_orders
    description: One row per order line item, typed and cleaned from raw.orders_raw
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: delivery_status
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Advance shipping'
                - 'Late delivery'
                - 'Shipping on time'
                - 'Shipping canceled'
      - name: late_delivery_risk
        tests:
          - not_null
      - name: shipping_mode
        tests:
          - not_null
